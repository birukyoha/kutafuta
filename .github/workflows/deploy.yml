name: Deploy to Production via FTP

on:
  push:
    branches: [ main ]

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Copy PHP backend & config files into dist/
        run: |
          # Copy root-level PHP backend, db_config, and htaccess into dist folder
          cp api.php dist/api.php
          cp db_config.php dist/db_config.php
          cp .htaccess dist/.htaccess

      - name: Deploy dist/ + PHP backend to Bluehost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: /public_html/kutafutatalent.com/
          dangerous-clean-slate: false